<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synth Snake | V3 PlayStation</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .circuit-body {
            background-color: #05070c;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
        }

        .arcade-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .series-badge {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .arcade-header h1 {
            font-size: 2.2rem;
            margin: 15px 0 5px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .arcade-header p {
            font-size: 1rem;
            color: #8ab4f8;
            margin: 0;
        }

        .arcade-container {
            background: #0d1322;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #1f2d50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 460px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .instructions {
            background: rgba(52, 211, 153, 0.05);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-left: 3px solid #34d399;
            padding: 0.75rem;
            font-size: 0.85rem;
            color: #8ab4f8;
            margin-bottom: 1.5rem;
            text-align: left;
            line-height: 1.4;
            border-radius: 4px;
        }

        .instructions strong {
            color: #34d399;
            letter-spacing: 1px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 1.2rem;
            font-size: 1.1rem;
            color: #fff;
            padding: 0 0.5rem;
        }

        .stats-bar strong {
            color: #34d399;
            margin-left: 10px;
            font-size: 1.3rem;
        }

        #gameCanvas {
            background: #05070c;
            border: 2px solid #1f3159;
            border-radius: 8px;
            margin-bottom: 1rem;
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.1);
            width: 100%;
            max-width: 400px;
        }

        /* Mobile Touch Controls D-Pad */
        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 200px;
            margin: 0 auto 1.2rem auto;
        }

        .d-pad-btn {
            background: #131b2e;
            border: 2px solid #1f3159;
            color: #34d399;
            font-size: 1.2rem;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
            user-select: none;
        }

        .d-pad-btn:active {
            background: #34d399;
            color: #05070c;
            border-color: #fff;
            box-shadow: 0 0 10px #34d399;
        }

        .btn-up {
            grid-column: 2;
        }

        .btn-left {
            grid-column: 1;
        }

        .btn-down {
            grid-column: 2;
        }

        .btn-right {
            grid-column: 3;
        }

        .arcade-btn {
            background: #34d399;
            color: #05070c;
            border: none;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .arcade-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        .arcade-btn:disabled {
            background: #1c2948;
            color: #4a6699;
            cursor: not-allowed;
        }

        .hub-action {
            border-top: 1px solid #1f2d50;
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        .hub-btn {
            display: inline-block;
            background: #2d3748;
            color: #a0aec0;
            text-decoration: none;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            transition: 0.2s ease;
            border: 1px solid transparent;
        }

        .hub-btn:hover {
            background: #3a4a63;
            color: #fff;
            border-color: #4a5a73;
        }

        /* Custom Modal UI */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 7, 12, 0.9);
            backdrop-filter: blur(4px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #131b2e;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid #ff3366;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.3);
            width: 100%;
        }

        .modal-content h2 {
            color: #ff3366;
            text-shadow: 0 0 15px #ff3366;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        .modal-content p {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .modal-btn {
            background: transparent;
            color: #ff3366;
            border: 2px solid #ff3366;
            padding: 0.8rem;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .modal-btn:hover {
            background: #ff3366;
            color: #05070c;
            box-shadow: 0 0 15px #ff3366;
        }
    </style>
</head>

<body class="circuit-body">

    <div class="arcade-header">
        <span class="series-badge">V3 PLAYSTATION - 12</span>
        <h1>Synth Snake</h1>
        <p>Kinetic routing and collection protocol.</p>
    </div>

    <div class="arcade-container">

        <div id="gameOverModal" class="modal-overlay">
            <div class="modal-content">
                <h2>SYSTEM CRASH</h2>
                <p>Final Node Count: <strong id="finalScoreDisplay">0</strong></p>
                <button id="modalDismissBtn" class="modal-btn">Acknowledge</button>
            </div>
        </div>

        <div class="instructions">
            <strong>PROTOCOL:</strong> Use the directional arrows or on-screen D-pad to route the green pulse block.
            Collect crimson data nodes to extend your sequence.
        </div>

        <div class="stats-bar">
            <span>Score: <strong id="score">0</strong></span>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- On-Screen Mobile Touch Controls -->
        <div class="mobile-controls">
            <button id="btnUp" class="d-pad-btn btn-up">▲</button>
            <button id="btnLeft" class="d-pad-btn btn-left">◀</button>
            <button id="btnDown" class="d-pad-btn btn-down">▼</button>
            <button id="btnRight" class="d-pad-btn btn-right">▶</button>
        </div>

        <button id="actionBtn" class="arcade-btn">Initialize Routing</button>

        <div class="hub-action">
            <a href="index.html" class="hub-btn">Back to Hub</a>
        </div>
    </div>

    <script src="js/snake.js"></script>
</body>

</html>
