<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Circuit | V3 PlayStation</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Global Arcade Layout Overrides */
        .circuit-body {
            background-color: #05070c;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
        }

        /* Master Headings (Outside Container) */
        .arcade-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .series-badge {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .arcade-header h1 {
            font-size: 2.2rem;
            margin: 15px 0 5px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .arcade-header p {
            font-size: 1rem;
            color: #8ab4f8;
            margin: 0;
        }

        /* Main Game Container */
        .arcade-container {
            background: #0d1322;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #1f2d50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 440px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Game Specific Styles */
        .instructions {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-left: 3px solid #00f3ff;
            padding: 0.75rem;
            font-size: 0.85rem;
            color: #8ab4f8;
            margin-bottom: 1.5rem;
            text-align: left;
            line-height: 1.4;
            border-radius: 4px;
        }

        .instructions strong {
            color: #00f3ff;
            letter-spacing: 1px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            color: #fff;
            padding: 0 0.5rem;
        }

        .stats-bar strong {
            color: #00f3ff;
        }

        .grid-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .node {
            background: #131b2e;
            height: 90px;
            border-radius: 10px;
            border: 2px solid #1f3159;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
        }

        .node-id {
            font-size: 0.7rem;
            color: #3b598c;
            position: absolute;
            top: 6px;
            left: 8px;
        }

        .node-core {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1a2744;
            border: 2px solid #2a4175;
            transition: all 0.15s ease;
        }

        .node.pulse {
            background: #1a3c5e;
            border-color: #00f3ff;
            box-shadow: 0 0 20px #00f3ff;
            transform: scale(1.04);
        }

        .node.pulse .node-core {
            background: #00f3ff;
            box-shadow: 0 0 10px #fff;
            border-color: #fff;
        }

        .node.clicked {
            background: #00ff88;
            border-color: #fff;
            box-shadow: 0 0 15px #00ff88;
        }

        .arcade-btn {
            background: #00f3ff;
            color: #05070c;
            border: none;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .arcade-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        .arcade-btn:disabled {
            background: #1c2948;
            color: #4a6699;
            cursor: not-allowed;
        }

        /* Proper Hub Button */
        .hub-action {
            border-top: 1px solid #1f2d50;
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        .hub-btn {
            display: inline-block;
            background: #2d3748;
            color: #a0aec0;
            text-decoration: none;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            transition: 0.2s ease;
            border: 1px solid transparent;
        }

        .hub-btn:hover {
            background: #3a4a63;
            color: #fff;
            border-color: #4a5a73;
        }

        /* Custom Modal UI */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 7, 12, 0.9);
            backdrop-filter: blur(4px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #131b2e;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid #ff3366;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.3);
            width: 100%;
        }

        .modal-content h2 {
            color: #ff3366;
            text-shadow: 0 0 15px #ff3366;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        .modal-content p {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .modal-btn {
            background: transparent;
            color: #ff3366;
            border: 2px solid #ff3366;
            padding: 0.8rem;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .modal-btn:hover {
            background: #ff3366;
            color: #05070c;
            box-shadow: 0 0 15px #ff3366;
        }
    </style>
</head>

<body class="circuit-body">

    <!-- Master Arcade Headings (Outside Container) -->
    <div class="arcade-header">
        <span class="series-badge">V3 PLAYSTATION - 11</span>
        <h1>Neon Circuit</h1>
        <p>System terminal sequence matching.</p>
    </div>

    <div class="arcade-container">

        <!-- The Custom Game Over Modal -->
        <div id="gameOverModal" class="modal-overlay">
            <div class="modal-content">
                <h2>SYSTEM BREACHED</h2>
                <p>Final Terminal Score: <strong id="finalScoreDisplay">0</strong></p>
                <button id="modalDismissBtn" class="modal-btn">Acknowledge</button>
            </div>
        </div>

        <div class="instructions">
            <strong>PROTOCOL:</strong> Observe the system's flashing sequence. Repeat the exact route by clicking the
            nodes before your energy dissipates.
        </div>

        <div class="stats-bar">
            <span>Score: <strong id="score">0</strong></span>
            <span>Energy: <strong id="energy">100</strong>%</span>
        </div>

        <div class="grid-board" id="gridBoard"></div>
        <button id="actionBtn" class="arcade-btn">Initialize Circuit</button>

        <!-- Proper Back to Hub Button -->
        <div class="hub-action">
            <a href="index.html" class="hub-btn">Back to Hub</a>
        </div>
    </div>

    <script src="js/circuit.js"></script>
</body>

</html>
