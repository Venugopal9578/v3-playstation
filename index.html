<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V3 PlayStation — Bubble Wrap Pop</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="game-container">
        <header class="game-header">
            <span class="badge">V3 PlayStation • 05</span>
            <h1>Bubble Wrap Pop</h1>
            <p class="subtitle">Clear your mind. Pop until satisfaction is achieved.</p>
        </header>

        <div class="arcade-card">
            <div class="stats-bar">
                <span>Popped: <strong id="popCount">0</strong></span>
                <button id="freshSheetBtn" class="action-btn-small">Fresh Sheet</button>
            </div>

            <div id="bubbleGrid" class="bubble-grid">
                <!-- Injected dynamically by JS -->
            </div>
        </div>
    </main>

    <script src="js/bubble.js"></script>
</body>

</html>
