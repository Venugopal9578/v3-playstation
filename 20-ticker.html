<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Ticker | V3 PlayStation</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .circuit-body {
            background-color: #05070c;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
        }

        .arcade-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .series-badge {
            background: rgba(234, 179, 8, 0.15);
            color: #eab308;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .arcade-header h1 {
            font-size: 2.2rem;
            margin: 15px 0 5px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .arcade-header p {
            font-size: 1rem;
            color: #8ab4f8;
            margin: 0;
        }

        .arcade-container {
            background: #0d1322;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #1f2d50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .instructions {
            background: rgba(234, 179, 8, 0.05);
            border: 1px solid rgba(234, 179, 8, 0.2);
            border-left: 3px solid #eab308;
            padding: 0.75rem;
            font-size: 0.85rem;
            color: #8ab4f8;
            margin-bottom: 1.5rem;
            text-align: left;
            line-height: 1.4;
            border-radius: 4px;
        }

        .hud-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1f2d50;
        }

        .hud-score {
            font-size: 1.3rem;
            font-weight: bold;
            color: #eab308;
            letter-spacing: 1px;
        }

        /* Terminal UI Layout */
        #dataGrid {
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        .ticker-card {
            background: #05070c;
            border: 2px solid #1f2d50;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 4px solid #eab308;
        }

        .ticker-header {
            font-family: 'Courier New', Courier, monospace;
            color: #64748b;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .ticker-header.blink {
            animation: pulse 1s infinite;
            color: #eab308;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }

        .ticker-asset {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .ticker-price {
            font-size: 3rem;
            font-weight: bold;
            color: #10b981;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .timer-bar-container {
            width: 100%;
            height: 6px;
            background: #1f2d50;
            border-radius: 3px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: #eab308;
            transition: width 0.1s linear;
        }

        /* Interrogation UI */
        .ticker-interrogation {
            width: 100%;
        }

        .ticker-question {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 500;
        }

        .ticker-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ticker-btn {
            background: #131b2e;
            color: #8ab4f8;
            border: 1px solid #1f2d50;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .ticker-btn:hover:not(:disabled) {
            background: rgba(234, 179, 8, 0.1);
            border-color: #eab308;
            color: #fff;
        }

        .ticker-btn.correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: #10b981 !important;
            color: #10b981 !important;
        }

        .ticker-btn.incorrect {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }

        .ticker-btn.correct-reveal {
            border-color: #10b981 !important;
            color: #10b981 !important;
        }

        .arcade-btn {
            background: #eab308;
            color: #05070c;
            border: none;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .arcade-btn:hover {
            background: #fef08a;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.6);
        }

        .arcade-btn:disabled {
            background: #423004;
            color: #856108;
            cursor: not-allowed;
        }

        .hub-action {
            border-top: 1px solid #1f2d50;
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        .hub-btn {
            display: inline-block;
            background: #2d3748;
            color: #a0aec0;
            text-decoration: none;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            transition: 0.2s ease;
            border: 1px solid transparent;
        }

        .hub-btn:hover {
            background: #3a4a63;
            color: #fff;
            border-color: #4a5a73;
        }

        /* Custom Modal UI */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 7, 12, 0.9);
            backdrop-filter: blur(4px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #131b2e;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid #eab308;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .modal-content h2 {
            color: #eab308;
            text-shadow: 0 0 15px currentColor;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        .modal-content p {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .modal-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #856108;
            padding: 0.8rem;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .modal-btn:hover {
            background: #856108;
            color: #fff;
        }
    </style>
</head>

<body class="circuit-body">

    <div class="arcade-header">
        <span class="series-badge">V3 PLAYSTATION - 20</span>
        <h1>The Crypto Ticker</h1>
        <p>Volatile asset retention.</p>
    </div>

    <div class="arcade-container">

        <div id="gameOverModal" class="modal-overlay">
            <div class="modal-content">
                <h2>FEED TERMINATED</h2>
                <p>Assets Decrypted: <strong id="finalScoreDisplay">0</strong></p>
                <button id="modalDismissBtn" class="modal-btn">Acknowledge</button>
            </div>
        </div>

        <div class="instructions">
            <strong>PROTOCOL:</strong> The mainframe will intercept a live cryptocurrency trade price. You have 4
            seconds to memorize the exact decimal configuration before it is scrambled.
        </div>

        <div class="hud-bar">
            <div class="hud-score">Streak: <span id="score">0</span></div>
        </div>

        <div id="dataGrid"></div>

        <button id="actionBtn" class="arcade-btn">Initialize Link</button>

        <div class="hub-action">
            <a href="index.html" class="hub-btn">Back to Hub</a>
        </div>
    </div>

    <script src="js/ticker.js"></script>
</body>

</html>
