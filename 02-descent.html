<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V3 PlayStation — Core Descent</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Module-Specific Overrides */
        body {
            overflow: hidden;
            background-color: #050505;
            justify-content: center;
        }

        .environment-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
        }

        .glass-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            background: rgba(15, 17, 23, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8);
            z-index: 1;
            margin: 0 20px;
        }

        .hud-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .depth-display {
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .depth-number {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: #ffffff;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .depth-unit {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-left: 8px;
            text-transform: lowercase;
        }

        .milestone-card {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .milestone-card h3 {
            color: #fcd34d;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .milestone-card p {
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-btn.primary {
            background: #f59e0b;
            color: #1e1402;
        }

        .action-btn.primary:hover {
            filter: brightness(1.15);
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .action-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <!-- Fullscreen Environment Canvas -->
    <canvas id="drillCanvas" class="environment-bg"></canvas>

    <main class="glass-panel">
        <header class="game-header" style="margin-bottom: 40px;">
            <span class="badge" style="color: #f59e0b; background: rgba(245, 158, 11, 0.15);">V3 PlayStation • 02</span>
            <h1 style="color: #ffffff;">Core Descent</h1>
            <p class="subtitle" style="color: #94a3b8;">Hold the drill to descend 6,371 km to the center of the Earth.
            </p>
        </header>

        <div class="hud-wrapper">
            <div class="depth-display">
                <span id="depthValue" class="depth-number">0.000</span>
                <span class="depth-unit">km</span>
            </div>

            <div class="milestone-card" id="milestoneCard">
                <h3 id="milestoneTitle">Surface Level</h3>
                <p id="milestoneText">The journey begins.</p>
            </div>

            <div class="controls">
                <button id="ascendBtn" class="action-btn secondary">Ascend</button>
                <button id="drillBtn" class="action-btn primary">Drill Down</button>
            </div>

            <div style="margin-top: 10px;">
                <a href="index.html" class="action-btn-small" style="text-decoration: none;">Back to Hub</a>
            </div>
        </div>
    </main>

    <script src="js/descent.js"></script>
</body>

</html>
