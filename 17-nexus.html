<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Nexus | V3 PlayStation</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .circuit-body {
            background-color: #05070c;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
        }

        .arcade-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .series-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .arcade-header h1 {
            font-size: 2.2rem;
            margin: 15px 0 5px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .arcade-header p {
            font-size: 1rem;
            color: #8ab4f8;
            margin: 0;
        }

        .arcade-container {
            background: #0d1322;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #1f2d50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 650px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .instructions {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-left: 3px solid #10b981;
            padding: 0.75rem;
            font-size: 0.85rem;
            color: #8ab4f8;
            margin-bottom: 1.5rem;
            text-align: left;
            line-height: 1.4;
            border-radius: 4px;
        }

        .hud-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1f2d50;
        }

        .hud-score {
            font-size: 1.3rem;
            font-weight: bold;
            color: #10b981;
            letter-spacing: 1px;
        }

        /* Demographic Grid Layout */
        #dataGrid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 2rem;
            position: relative;
            align-items: center;
        }

        @media (min-width: 600px) {
            #dataGrid {
                flex-direction: row;
                justify-content: center;
                align-items: stretch;
            }
        }

        .country-card {
            background: #05070c;
            border: 2px solid #1f2d50;
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .country-card img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }

        .country-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
            text-align: center;
            min-height: 55px;
            display: flex;
            align-items: center;
        }

        .population-label {
            font-size: 0.75rem;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .population-value {
            font-size: 2rem;
            font-weight: bold;
            color: #10b981;
            font-family: 'Courier New', Courier, monospace;
        }

        .population-value.hidden {
            display: none;
        }

        .vs-badge {
            background: #1f2d50;
            color: #fff;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 50%;
            font-size: 0.9rem;
            z-index: 10;
            margin: -10px 0;
        }

        @media (min-width: 600px) {
            .vs-badge {
                margin: 0 -20px;
                align-self: center;
            }
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 5px;
        }

        .guess-btn {
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .guess-btn.high {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .guess-btn.high:hover {
            background: #10b981;
            color: #05070c;
        }

        .guess-btn.low {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .guess-btn.low:hover {
            background: #ef4444;
            color: #05070c;
        }

        .arcade-btn {
            background: #10b981;
            color: #05070c;
            border: none;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .arcade-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        .arcade-btn:disabled {
            background: #063c27;
            color: #0f764f;
            cursor: not-allowed;
        }

        .hub-action {
            border-top: 1px solid #1f2d50;
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        .hub-btn {
            display: inline-block;
            background: #2d3748;
            color: #a0aec0;
            text-decoration: none;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            transition: 0.2s ease;
            border: 1px solid transparent;
        }

        .hub-btn:hover {
            background: #3a4a63;
            color: #fff;
            border-color: #4a5a73;
        }

        /* Custom Modal UI */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 7, 12, 0.9);
            backdrop-filter: blur(4px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #131b2e;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid #10b981;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
            width: 100%;
        }

        .modal-content h2 {
            color: #10b981;
            text-shadow: 0 0 15px currentColor;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        .modal-content p {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .modal-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #3b598c;
            padding: 0.8rem;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .modal-btn:hover {
            background: #3b598c;
            color: #fff;
        }
    </style>
</head>

<body class="circuit-body">

    <div class="arcade-header">
        <span class="series-badge">V3 PLAYSTATION - 17</span>
        <h1>Global Nexus</h1>
        <p>Demographic prediction engine.</p>
    </div>

    <div class="arcade-container">

        <div id="gameOverModal" class="modal-overlay">
            <div class="modal-content">
                <h2>SEQUENCE BROKEN</h2>
                <p>Consecutive Predictions: <strong id="finalScoreDisplay">0</strong></p>
                <button id="modalDismissBtn" class="modal-btn">Acknowledge</button>
            </div>
        </div>

        <div class="instructions">
            <strong>PROTOCOL:</strong> Assess the target nation. Predict if its total population is strictly higher or
            lower than the reference nation.
        </div>

        <div class="hud-bar">
            <div class="hud-score">Streak: <span id="score">0</span></div>
        </div>

        <div id="dataGrid"></div>

        <button id="actionBtn" class="arcade-btn">Initialize Link</button>

        <div class="hub-action">
            <a href="index.html" class="hub-btn">Back to Hub</a>
        </div>
    </div>

    <script src="js/nexus.js"></script>
</body>

</html>
