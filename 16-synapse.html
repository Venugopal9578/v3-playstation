<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Match | V3 PlayStation</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        .circuit-body {
            background-color: #05070c;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
        }

        .arcade-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .series-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .arcade-header h1 {
            font-size: 2.2rem;
            margin: 15px 0 5px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .arcade-header p {
            font-size: 1rem;
            color: #8ab4f8;
            margin: 0;
        }

        .arcade-container {
            background: #0d1322;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #1f2d50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .instructions {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-left: 3px solid #10b981;
            padding: 0.75rem;
            font-size: 0.85rem;
            color: #8ab4f8;
            margin-bottom: 1.5rem;
            text-align: left;
            line-height: 1.4;
            border-radius: 4px;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1f2d50;
        }

        .hud-target {
            font-size: 1.1rem;
            color: #fff;
        }

        .hud-target strong {
            color: #10b981;
        }

        .hud-score {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ff3366;
        }

        /* The 3D Memory Grid */
        #dataGrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 1.5rem;
            perspective: 1000px;
        }

        .memory-card {
            aspect-ratio: 2/3;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .memory-card.flipped {
            transform: rotateY(180deg);
        }

        /* Grey-out effect for finished cards */
        .memory-card.matched {
            transform: rotateY(180deg) scale(0.95);
            pointer-events: none;
        }

        .memory-card.matched .card-back {
            filter: grayscale(100%) opacity(0.3);
            border-color: #334155;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* Strict backface visibility hiding for cross-browser stability */
        .card-front,
        .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #1f2d50;
        }

        .card-front {
            background: repeating-linear-gradient(45deg, #0f172a, #0f172a 10px, #131c30 10px, #131c30 20px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-front::after {
            content: 'V3';
            font-family: 'Russo One', sans-serif;
            color: #10b981;
            font-size: 1.5rem;
            opacity: 0.4;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #05070c;
            border-color: #10b981;
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .arcade-btn {
            background: #10b981;
            color: #05070c;
            border: none;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .arcade-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        .arcade-btn:disabled {
            background: #063c27;
            color: #0f764f;
            cursor: not-allowed;
        }

        .hub-action {
            border-top: 1px solid #1f2d50;
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        .hub-btn {
            display: inline-block;
            background: #2d3748;
            color: #a0aec0;
            text-decoration: none;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            transition: 0.2s ease;
            border: 1px solid transparent;
        }

        .hub-btn:hover {
            background: #3a4a63;
            color: #fff;
            border-color: #4a5a73;
        }

        /* Custom Modal UI */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 7, 12, 0.9);
            backdrop-filter: blur(4px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #131b2e;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid #10b981;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
            width: 100%;
        }

        .modal-content h2 {
            color: #10b981;
            text-shadow: 0 0 15px currentColor;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        .modal-content p {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .modal-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #3b598c;
            padding: 0.8rem;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .modal-btn:hover {
            background: #3b598c;
            color: #fff;
        }
    </style>
</head>

<body class="circuit-body">

    <div class="arcade-header">
        <span class="series-badge">V3 PLAYSTATION - 16</span>
        <h1>Cinematic Match</h1>
        <p>Tactical visual decryption sequence.</p>
    </div>

    <div class="arcade-container">

        <div id="gameOverModal" class="modal-overlay">
            <div class="modal-content">
                <h2>MATRIX CLEARED</h2>
                <p>Total Moves Required: <strong id="finalScoreDisplay">0</strong></p>
                <button id="modalDismissBtn" class="modal-btn">Acknowledge</button>
            </div>
        </div>

        <div class="instructions">
            <strong>PROTOCOL:</strong> Memorize the encrypted assets and pair the identical signatures. Rest your mind.
        </div>

        <div class="hud-bar">
            <div class="hud-target">Matches: <strong id="matchesFound">0</strong><span
                    style="font-size: 0.8rem; color: #64748b;"> / 8</span></div>
            <div class="hud-score">Moves: <span id="movesCount">0</span></div>
        </div>

        <div id="dataGrid"></div>

        <button id="actionBtn" class="arcade-btn">Initialize Decryption</button>

        <div class="hub-action">
            <a href="index.html" class="hub-btn">Back to Hub</a>
        </div>
    </div>

    <script src="js/synapse.js"></script>
</body>

</html>
