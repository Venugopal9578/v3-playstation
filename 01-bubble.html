<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V3 PlayStation — Bubble</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Your original tactile styling */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1rem;
            color: #cbd5e1;
            padding: 0 4px;
        }

        .bubble-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            background: #0f1117;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .bubble {
            aspect-ratio: 1;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset 0 4px 6px rgba(255, 255, 255, 0.4), 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease, border-radius 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .bubble:active {
            transform: scale(0.9);
        }

        /* The crushed plastic aesthetic you preferred */
        .bubble.popped {
            background: rgba(148, 163, 184, 0.15) !important;
            border: 1px dashed rgba(203, 213, 225, 0.3);
            border-radius: 35% 65% 50% 50% / 40% 40% 60% 60%;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6), 0 1px 2px rgba(255, 255, 255, 0.05);
            cursor: default;
            transform: scale(0.88) rotate(5deg);
        }
    </style>
</head>

<body>
    <main class="game-container">
        <header class="game-header">
            <span class="badge">V3 PlayStation • 01</span>
            <h1>Bubble</h1>
            <p class="subtitle">Satisfying digital sensory grid.</p>
        </header>

        <div class="canvas-card">
            <div class="stats-bar">
                <span style="font-weight: 600; color: #fbbf24;">Popped: <span id="popCount"
                        style="color: #f1f5f9;">0</span></span>
                <button id="freshSheetBtn" class="action-btn-small">Fresh Sheet</button>
            </div>

            <div id="bubbleGrid" class="bubble-grid"></div>

            <div class="controls-bar" style="margin-top: 20px;">
                <a href="index.html" class="action-btn-small" style="text-decoration: none;">Back to Hub</a>
            </div>
        </div>
    </main>
    <script src="js/bubble.js"></script>
</body>

</html>
