<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cipher Matrix | V3 PlayStation</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .circuit-body {
            background-color: #05070c;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
        }

        .arcade-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .series-badge {
            background: rgba(139, 92, 246, 0.15);
            color: #8b5cf6;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .arcade-header h1 {
            font-size: 2.2rem;
            margin: 15px 0 5px 0;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .arcade-header p {
            font-size: 1rem;
            color: #8ab4f8;
            margin: 0;
        }

        .arcade-container {
            background: #0d1322;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #1f2d50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 600px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .instructions {
            background: rgba(139, 92, 246, 0.05);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-left: 3px solid #8b5cf6;
            padding: 0.75rem;
            font-size: 0.85rem;
            color: #8ab4f8;
            margin-bottom: 1.5rem;
            text-align: left;
            line-height: 1.4;
            border-radius: 4px;
        }

        .hud-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1f2d50;
        }

        .hud-score {
            font-size: 1.3rem;
            font-weight: bold;
            color: #8b5cf6;
            letter-spacing: 1px;
        }

        /* Trivia UI Layout */
        #dataGrid {
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .cipher-card {
            background: #05070c;
            border: 2px solid #1f2d50;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            box-sizing: border-box;
        }

        .cipher-difficulty {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .cipher-difficulty.easy {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .cipher-difficulty.medium {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .cipher-difficulty.hard {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .cipher-question {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 500;
        }

        .cipher-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cipher-btn {
            background: #131b2e;
            color: #8ab4f8;
            border: 1px solid #1f2d50;
            padding: 12px 15px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }

        .cipher-btn:hover:not(:disabled) {
            background: rgba(139, 92, 246, 0.1);
            border-color: #8b5cf6;
            color: #fff;
        }

        .cipher-btn:disabled {
            cursor: default;
        }

        /* Answer Feedback Animations */
        .cipher-btn.correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: #10b981 !important;
            color: #10b981 !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .cipher-btn.incorrect {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }

        .cipher-btn.correct-reveal {
            background: rgba(16, 185, 129, 0.1) !important;
            border-color: #10b981 !important;
            color: #10b981 !important;
        }

        .arcade-btn {
            background: #8b5cf6;
            color: #fff;
            border: none;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .arcade-btn:hover {
            background: #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.6);
        }

        .arcade-btn:disabled {
            background: #2e1f4f;
            color: #5a458a;
            cursor: not-allowed;
        }

        .hub-action {
            border-top: 1px solid #1f2d50;
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        .hub-btn {
            display: inline-block;
            background: #2d3748;
            color: #a0aec0;
            text-decoration: none;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            transition: 0.2s ease;
            border: 1px solid transparent;
        }

        .hub-btn:hover {
            background: #3a4a63;
            color: #fff;
            border-color: #4a5a73;
        }

        /* Custom Modal UI */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 7, 12, 0.9);
            backdrop-filter: blur(4px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #131b2e;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid #8b5cf6;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .modal-content h2 {
            color: #8b5cf6;
            text-shadow: 0 0 15px currentColor;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            font-size: 1.5rem;
        }

        .modal-content p {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .modal-btn {
            background: transparent;
            color: #fff;
            border: 2px solid #4c3285;
            padding: 0.8rem;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .modal-btn:hover {
            background: #4c3285;
            color: #fff;
        }
    </style>
</head>

<body class="circuit-body">

    <div class="arcade-header">
        <span class="series-badge">V3 PLAYSTATION - 18</span>
        <h1>The Cipher Matrix</h1>
        <p>Cinematic knowledge decryption.</p>
    </div>

    <div class="arcade-container">

        <div id="gameOverModal" class="modal-overlay">
            <div class="modal-content">
                <h2>SEQUENCE COMPLETE</h2>
                <p>Ciphers Decoded: <strong id="finalScoreDisplay">0</strong> / 10</p>
                <button id="modalDismissBtn" class="modal-btn">Acknowledge</button>
            </div>
        </div>

        <div class="instructions">
            <strong>PROTOCOL:</strong> The mainframe will present 10 encrypted questions regarding cinematic history.
            Select the correct decryption key.
        </div>

        <div class="hud-bar">
            <div class="hud-score">Score: <span id="score">0</span></div>
        </div>

        <div id="dataGrid"></div>

        <button id="actionBtn" class="arcade-btn">Initialize Decryption</button>

        <div class="hub-action">
            <a href="index.html" class="hub-btn">Back to Hub</a>
        </div>
    </div>

    <script src="js/cipher.js"></script>
</body>

</html>
